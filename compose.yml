services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-frost_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    image: wigglebop25/frostbyte-api:latest
    # build: .
    restart: always
    ports:
      - "443:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-frost_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_CASHIER_PASSWORD: ${SEED_CASHIER_PASSWORD}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD}
      TZ: Asia/Manila
    volumes:
      - ./.env:/app/.env
      - ./server.crt:/app/server.crt
      - ./server.key:/app/server.key
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: