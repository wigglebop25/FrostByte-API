name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frostbyte-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

          # 2. Copy Configuration Files
          scp -i ~/.ssh/id_rsa ./compose.yml ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/FrostByte-API/

          # 3. Remote Deployment Script
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            # Stop on error
            set -e
            
            cd ~/FrostByte-API || mkdir -p ~/FrostByte-API && cd ~/FrostByte-API

            # A. Fix Permissions (Ensure user owns the directory and files)
            echo 'Fixing permissions...'
            sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} .

            # B. Create/Overwrite .env file from Secrets
            # This ensures the running container ALWAYS uses the correct secrets
            echo 'Updating .env file...'
            cat <<EOF > .env
            SERVER_PORT=8080
            DB_HOST=db
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            # C. Deploy
            echo 'Pulling latest image...'
            docker-compose pull api
            
            echo 'Restarting services...'
            # 'up -d' is smarter than 'down && up'. It only recreates changed containers.
            # We add --force-recreate to ensure it picks up the new .env if variables changed.
            docker-compose up -d --force-recreate --remove-orphans
            
            # D. Cleanup
            docker image prune -f
          "