name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frostbyte-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Add Server to Known Hosts
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

          # Debug: List files to ensure we are in the right place
          echo "Current directory contents:"
          ls -la

          # 3. Copy Configuration Files to Server
          scp -i ~/.ssh/id_rsa ./compose.yml ./Dockerfile ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/frostbyte-api/

          # 4. Run Deployment Commands
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            cd frostbyte-api &&
            # Login to Docker Hub (using the credentials passed from local env is hard via SSH)
            # Simpler: Just pull public/private image if logged in, or rebuild locally
            # Since we push the image in the previous job, we just need to pull it.
            # But wait, compose needs to know to pull 'wigglebop25/frostbyte-api'.
            
            # We need to ensure 'docker login' happened on the server at least once or make the image public.
            # Assuming public image or logged in manually once.
            
            docker-compose pull &&
            docker-compose down &&
            docker-compose up -d --remove-orphans
          "
