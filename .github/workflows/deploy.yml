name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frostbyte-api:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frostbyte-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

          # 2. Ensure Remote Directory Exists
          # We run this BEFORE scp to avoid "dest open failure"
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} "mkdir -p ~/FrostByte-API"

          # 3. Copy Configuration Files
          scp -i ~/.ssh/id_rsa ./compose.yml ./Caddyfile ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/FrostByte-API/

          # 4. Remote Deployment Script
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            set -e
            cd ~/FrostByte-API

            # Fix Permissions
            echo 'Fixing permissions...'
            sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} .

            # Create/Overwrite .env file from Secrets
            echo 'Updating .env file...'
            cat <<EOF > .env
            SERVER_PORT=8080
            DB_HOST=db
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            # Seeder Passwords
            SEED_ADMIN_PASSWORD=${{ secrets.SEED_ADMIN_PASSWORD }}
            SEED_CASHIER_PASSWORD=${{ secrets.SEED_CASHIER_PASSWORD }}
            SEED_CUSTOMER_PASSWORD=${{ secrets.SEED_CUSTOMER_PASSWORD }}
            EOF

            # Deploy
            echo 'Pulling latest images...'
            docker-compose pull api
            docker-compose pull frontend
            
            echo 'Updating services (Rolling update)...'
            # efficient update: only recreates changed containers (api) without stopping db/caddy
            docker-compose up -d --remove-orphans --no-deps api
            docker-compose up -d --remove-orphans --no-deps frontend
            docker-compose up -d --remove-orphans caddy
            
            # Wait for database to be ready
            echo 'Waiting for database to be ready...'
            for i in {1..30}; do
              if docker-compose exec -T db mysql -u root -p"${{ secrets.DB_PASSWORD }}" -e 'SELECT 1' &> /dev/null; then
                echo 'Database is ready!'
                break
              fi
              echo 'Waiting for database...'
              sleep 2
            done
            
            # Run seeder to populate database if empty
            echo 'Running database seeder...'
            docker-compose exec -T api /app/seeder
            
            # Cleanup
            docker image prune -f
          "
